aid: breathwrk
name: Breathwrk
description: 'Breathwrk is a consumer health and performance app offering guided breathing
  exercises to reduce stress, improve sleep, boost energy, and enhance athletic and social
  performance. It packages more than 50 science-backed breathing techniques with music, haptics,
  coach-led classes, and progress tracking across calming, sleep, energizing, performance, and
  social categories. Breathwrk is available on iOS and Android with free and Pro subscription
  tiers plus a Breathwrk for Business program for organizations, and the company is now part of
  Peloton. Breathwrk publishes no public API, SDK, or developer program; this profile is maintained
  by API Evangelist and reflects the company''s live web presence and security posture.'
